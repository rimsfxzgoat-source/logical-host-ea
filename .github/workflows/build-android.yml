name: Build Android app

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Unzip and build
        run: |
          ZIP=$(ls logical-host-android*.zip | sort -V | tail -1)
          echo "Using $ZIP"
          mkdir src && unzip -q "$ZIP" -d src
          cd src && gradle --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/LOGICAL-HOST.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: LOGICAL-HOST-android
          path: LOGICAL-HOST.apk
